<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İstatistik Arenası – 80 dakikalık ders oyunu</title>
<style>
:root{--bg:#fff7ec;--ink:#221a3f;--card:#fff;--line:#e4d5f2;--a:#ff4d6d;--b:#00b894;--c:#ffd166;--p:#7c5cff;--o:#ff9f1c;--mute:#6b6a8c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181230;--ink:#fff3e6;--card:#241b47;--line:#4a3f80;--mute:#c3bce0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181230;--ink:#fff3e6;--card:#241b47;--line:#4a3f80;--mute:#c3bce0;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
h1,h2,.q,.big{font-family:"Comic Sans MS","Comic Sans","Trebuchet MS",Georgia,serif}
h1{font-size:clamp(26px,4.5vw,40px);margin:0;line-height:1.1}
h2{margin:0 0 8px}
.top{max-width:1000px;margin:auto;padding:16px 18px 4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:700}
button,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.go{background:linear-gradient(135deg,var(--a),var(--o));color:#fff;border-color:var(--a)}
.go2{background:linear-gradient(135deg,var(--b),var(--p));color:#fff;border-color:var(--b)}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 18px;max-width:1000px;margin:auto}
nav button{flex:none;font-size:15px}
nav button.on{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border-color:var(--ink)}
main{max-width:1000px;margin:auto;padding:4px 18px 60px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:26px;border-top:10px solid var(--c);padding:22px;margin-bottom:16px;box-shadow:6px 6px 0 color-mix(in srgb,var(--p) 55%,var(--ink));transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px) rotate(-.4deg)}
.q{font-size:clamp(22px,3.6vw,32px);margin:10px 0 16px}
.small{color:var(--mute);font-size:15px}
.big{font-size:clamp(32px,7vw,58px);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.opts button{text-align:left;padding:13px}
.ok{background:var(--b)!important;color:#fff!important;border-color:var(--b)!important}
.no{background:var(--a)!important;color:#fff!important;border-color:var(--a)!important}
.why{margin-top:12px;padding:12px 14px;border-left:6px solid var(--o);background:color-mix(in srgb,var(--c) 20%,transparent);border-radius:10px}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--b)}
.tb i{background:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:46px}
.chip{border:2px dashed var(--line);border-radius:12px;padding:8px 12px}
.chip.b{border:2px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer}
.chip.good{background:var(--b);color:#fff;border-color:var(--b)}.chip.bad{background:var(--a);color:#fff;border-color:var(--a)}
table{border-collapse:collapse;width:100%;margin:10px 0}
th,td{border:2px solid var(--ink);padding:7px;text-align:center}
th{background:linear-gradient(135deg,var(--c),#ffe9ad);color:#14213d}
td button{padding:1px 9px;margin:0 3px}
.pct{font-size:13px;color:var(--mute);display:block}
.learn td{text-align:left}
.ex{margin:6px 0;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--b) 14%,transparent)}
.ex.x{background:color-mix(in srgb,var(--a) 14%,transparent)}
details{margin:8px 0}
summary{cursor:pointer;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(15,10,40,.82);z-index:20;overflow:auto;display:flex;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 20px}
.ov>div{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px;max-width:640px;width:100%;height:max-content;text-align:center}
canvas{width:100%;max-width:560px;height:auto}
.slot{display:flex;gap:12px;flex-wrap:wrap}
.reel{flex:1;min-width:220px;background:var(--ink);color:var(--bg);border-radius:14px;padding:18px;font-size:clamp(20px,3.4vw,30px);font-weight:700;text-align:center;font-family:"Comic Sans MS","Trebuchet MS",cursive}
.bars{display:flex;gap:16px;align-items:flex-end;height:180px;padding:8px;border-bottom:3px solid var(--ink);overflow-x:auto}
.grp{display:flex;gap:4px;align-items:flex-end;height:100%;flex:none}
.grp i{display:block;width:28px;border-radius:5px 5px 0 0;min-height:2px}
.lbl{display:flex;gap:16px;padding:4px 8px;overflow-x:auto}
.lbl span{flex:none;text-align:center;font-size:14px}
.pod{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:18px 0}
.pod div{background:var(--c);color:#14213d;border:2px solid var(--ink);border-radius:12px 12px 0 0;padding:10px;min-width:100px;font-weight:700}
.tug{display:flex;align-items:center;gap:10px;font-size:20px}
.tugb{flex:1;height:22px;background:var(--b);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.tugb i{display:block;height:100%;background:var(--a);transition:width .5s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--p) 16%,transparent) 1.5px,transparent 0);background-size:24px 24px}
h1{background:linear-gradient(90deg,var(--a),var(--o),var(--c),var(--b),var(--p),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hues 7s linear infinite}
.card:nth-of-type(3n+2){border-top-color:var(--b)}.card:nth-of-type(3n){border-top-color:var(--a)}
button{transition:transform .12s}
button:hover:not(:disabled){transform:translateY(-2px) rotate(-1deg)}
button:active:not(:disabled){transform:scale(.94)}
nav button.unit{background:var(--c);color:var(--ink);border-color:var(--ink)}
nav button.unit.on{background:linear-gradient(135deg,var(--a),var(--o));color:#fff}
@keyframes hues{0%{background-position:0 0}100%{background-position:300% 0}}
@keyframes pp{0%{transform:translateY(0) scale(.5) rotate(0)}100%{transform:translateY(-170px) scale(1.8) rotate(15deg);opacity:0}}
.pp{position:fixed;font-size:52px;pointer-events:none;z-index:30;animation:pp 1.1s ease-out forwards}
.in{width:72px;font:inherit;padding:4px;border:2px solid var(--ink);border-radius:8px;text-align:center;background:var(--card);color:var(--ink)}
.in.good{background:var(--b);color:#fff}.in.bad{background:var(--a);color:#fff}
.mc{display:flex;gap:16px;align-items:flex-end;border-bottom:3px solid var(--ink);padding:22px 6px 4px;margin:6px 0;overflow-x:auto}
.mg{text-align:center;flex:none}
.mb{display:flex;gap:3px;align-items:flex-end;height:92px}
.mb i{display:block;width:24px;position:relative;border-radius:4px 4px 0 0;min-height:2px}
.mb b{position:absolute;top:-16px;left:-5px;width:34px;font-size:11px;font-style:normal;text-align:center}
.mg span{font-size:13px}
.learn ol{padding-left:22px}.learn li{margin:6px 0}
@media (prefers-reduced-motion:reduce){.pp{animation:none;display:none}}
</style>
</head>
<body>
<div class="top"><h1>🎮 İstatistik Arenası</h1>
<div class="row"><span class="pill" id="clock">--:--</span><button id="pz">Duraklat</button><button id="gm">Gelmeyenler</button><button id="tk">Takımlar</button><button id="lb">Puan tablosu</button><button id="wh" class="go">🎡 Çark</button><button id="th">Gece/Gündüz</button></div></div>
<nav id="nav" aria-label="Ders akışı"></nav>
<main id="main"></main>
<script>
"use strict";
var NAMES=["Okan Özşahin","Abdullah Enes Köroğlu","Orhun Özdemir","Kaan Demir Özen","Osman Pınarcı","Salih Yiğit Aytufan","Mert Gümüş","Yağmur Kazan","Cayda Eker","Çınar Efe Yüksel","Cemre Sıla Karcıoğlu","Berensu Erdoğan","Ömer Vehbi Aksoy","Keremcan Doğan Kızılırmak","Enes Kaan Özçakır","Kuzey Gürsel Boyraz","Serdar Baran","Muhammet Mert Erdem","Esra Davetci","Mustafa Emre Şahin","Esra Bulut","Zeynep Yağmur Gündüz","Zübeyde Öykü Kalınç","Tarık Buğra Önder","Ali Efe Gökçen","Elif Su Gültekin","Erol Öztürk","Ece İclal Şahin","Nur Banu Kılıç","Elif Korkmaz","Zümra Öcal","Ömer Kaan Çelik","Sevde Yasan","Mert Necati Güneş"];
var $=function(i){return document.getElementById(i)};
var sc={},used={},absent={},streak=0,timers=[],cur=0;
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function add(n,p){n=n||"Sınıf";sc[n]=(sc[n]||0)+p;if(p>0)pop()}
function clr(){timers.forEach(clearInterval);timers=[]}
function every(f,ms){var t=setInterval(f,ms);timers.push(t);return t}
function ov(html){var o=document.createElement("div");o.className="ov";o.innerHTML="<div>"+html+"</div>";document.body.appendChild(o);o.close=function(){o.remove()};return o}
function shortN(n){var p=n.split(" ");return p.length>1?p[0]+" "+p[p.length-1][0]+".":n}

/* ---------- ÇARK ---------- */
var COLS=["#ff4d6d","#00c2a8","#ffd166","#7c5cff","#ff9f1c","#2a9df4"];
function wheel(cb,title,pool0){
 var base=(pool0||NAMES).filter(function(n){return!absent[n]});if(!base.length)base=(pool0||NAMES).slice();var pool=base.filter(function(n){return!used[n]});if(!pool.length){used={};pool=base.slice()}
 var o=ov('<h2>'+(title||"Kim cevaplayacak?")+'</h2><canvas id="cv" width="560" height="560"></canvas><div class="big" id="pk" style="min-height:1.3em"></div><div class="row" style="justify-content:center"><button id="sp" class="go">🎡 ÇEVİR</button><button id="cl">Kapat</button></div>');
 var cv=$("cv"),x=cv.getContext("2d"),n=pool.length,a=2*Math.PI/n,rot=0,pick=null;
 function draw(){x.clearRect(0,0,560,560);x.save();x.translate(280,290);
  for(var i=0;i<n;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,262,rot+i*a,rot+(i+1)*a);x.fillStyle=COLS[i%6];x.fill();x.strokeStyle="#fff";x.lineWidth=1;x.stroke();
   x.save();x.rotate(rot+(i+.5)*a);x.fillStyle=(i%6==2)?"#221a3f":"#fff";x.font="bold 13px Trebuchet MS,sans-serif";x.textAlign="right";x.textBaseline="middle";x.fillText(shortN(pool[i]),250,0);x.restore()}
  x.beginPath();x.arc(0,0,22,0,7);x.fillStyle="#221a3f";x.fill();x.restore();
  x.beginPath();x.moveTo(262,6);x.lineTo(298,6);x.lineTo(280,50);x.closePath();x.fillStyle="#7c5cff";x.fill();x.strokeStyle="#fff";x.lineWidth=3;x.stroke()}
 draw();
 $("cl").onclick=function(){o.close()};
 $("sp").onclick=function(){
  var i=Math.random()*n|0,start=rot%(2*Math.PI),end=-Math.PI/2-(i+.5)*a+2*Math.PI*(6+Math.random()*0),t0=performance.now();
  end=end-Math.floor(end/(2*Math.PI))*2*Math.PI+2*Math.PI*6;rot=start;var from=start;$("sp").disabled=true;$("pk").textContent="";
  (function f(t){var p=Math.min(1,(t-t0)/4800),e=1-Math.pow(1-p,3);rot=from+(end-from)*e;draw();
   if(p<1)requestAnimationFrame(f);else{pick=pool[i];used[pick]=1;$("pk").textContent=pick;
    $("sp").outerHTML='<button id="ok" class="go2">Bu kişi cevaplasın</button> <button id="ab">Sınıfta yok, çıkar</button>';$("ok").onclick=function(){o.close();cb&&cb(pick)};$("ab").onclick=function(){absent[pick]=1;delete used[pick];o.close();wheel(cb,title,pool0)}}})(t0)}
}

/* ---------- SORU BANKASI ---------- */
var K=["Kategorik","Sayısal"],U=["Uygun","Uygun değil"],B=["Birincil","İkincil"],D=["Doğru kullanım","Hatalı kullanım"];
var O8=["Amaç net olmalı","Araştırmaya değer olmalı","Evren açık olmalı","Değişken açık olmalı","Veri toplanabilir olmalı","Değişebilirliği yansıtmalı","Gruba ulaşılabilmeli","Kategorik veriye uygun olmalı"];
var KAT=[["Kan grubu (A, B, AB, 0)",0,"Kan grubu sınıflandırır, hesaplama gerektirmez."],["Günlük uyku süresi (saat)",1,"Ölçülebilir sayısal değerdir."],["Okul türü (Fen, Anadolu, Meslek)",0,"Gruplara ayrılan nitel özellik."],["Sınavdan alınan puan",1,"Puanlar toplanıp çıkarılabilir."],["Cinsiyet",0,"Nitel sınıflandırma."],["Günlük çalışma süresi (dakika)",1,"Dakika sayısal ölçümdür."],["Telefon markası",0,"Markanın büyüklük sıralaması yoktur."],["Doğum ayı (Ocak, Şubat…)",0,"Kitapta kategorik kabul edilir."],["Musluktan akan su miktarı (litre)",1,"Litre ölçülebilir."],["Sosyo-ekonomik durum (alt, orta, üst)",0,"Gruplara ayrılmış nitel özellik."],["Evcil hayvan türü",0,"Sınıflandırmadır."],["Yılda okunan kitap sayısı",1,"Sayılabilir, sayısal."]];
var BAG=[["Cinsiyet ile tercih edilen spor dalı arasındaki ilişki",0,"İkisi de kategorik."],["Aracın ağırlığı ile lastik sayısı arasındaki ilişki",1,"İkisi de sayısal."],["Okul türü ile katıldıkları kulüp türü arasındaki ilişki",0,"İkisi de gruptur."],["Aldıkları not ile ders saati arasındaki ilişki",1,"Not ve saat sayısal."],["Sosyal medya platformu ile kullanım amacı arasındaki ilişki",0,"İkisi de sınıflandırma."],["Yaşları ile boy uzunlukları arasındaki ilişki",1,"Yaş ve boy sayısal."],["Çalışma saat dilimi (sabah/akşam) ile verimlilik düzeyi arasındaki ilişki",0,"İkisi de kategorik."],["Fabrikanın üretim süresi ile ürün sayısı arasındaki ilişki",1,"İkisi de sayısal."]];
var OLC=[["“Bazı işlerin başarı üzerindeki etkisi nedir?”",0,"“Bazı işler” belirsiz, ilişki de tanımsız."],["“Kahve içme alışkanlığı ile kırmızı giyme arasında ilişki var mı?”",1,"Bilimsel ya da pratik fayda yok."],["“Bazı insanların spor alışkanlığı ile beslenme alışkanlığı arasında ilişki var mı?”",2,"Hangi insanlar? Evren belirsiz."],["“İnsanların bazı özellikleri ile ağ kullanımı arasında ilişki var mı?”",3,"Hangi özellikler? Değişken net değil."],["“Orta Çağ’da yaşayan insanların ruh hâli ile çalışma alışkanlığı arasında ilişki var mı?”",4,"O dönemde veri toplamak çok zor."],["“İnsanların otomobil tercihi arasında ilişki var mı?”",5,"Tek değişken var; değişebilirlik görünmüyor."],["“Dünyadaki tüm insanların uyku düzeni ile mutluluk düzeyi arasında ilişki var mı?”",6,"Evren çok geniş, araştırma imkânı yok."],["“Kişilerin yaşları ile aylık maaşları arasında ilişki var mı?”",7,"Yaş ve maaş sayısal."]];
var VER=[["Öğrencilerle röportaj yapmak",0,"Veriyi doğrudan sen topluyorsun."],["TÜİK verilerinden yararlanmak",1,"Hazır resmî istatistik."],["Kendi gözlemlerini not almak",0,"Gözlem birincil yöntemdir."],["Dergide yayımlanan araştırma sonuçlarını kullanmak",1,"Başkasının yayımladığı veri."],["Kendi hazırladığın anketi uygulamak",0,"Anket birincil araçtır."],["Akademik makale özetlerini kullanmak",1,"İkincil veri."],["Test uygulamak",0,"Birincil araç."],["Kurumsal veri tabanlarını kullanmak",1,"Önceden toplanmış veri."]];
var DIJ=[["Karayolları Genel Müdürlüğü’nün resmî sayfasından yol bilgisi almak",0,"Resmî kurum: güvenilir."],["Kaynağı belli olmayan hesaptan istatistik almak",1,"Kaynak tespit edilemiyor."],["2025-26 sorusunu 2024-25 kazanımlarına göre hazırlamak",1,"Güncellik ihlali."],["TDK’nin resmî sayfasından bilgi almak",0,"Resmî sayfa güvenilir."],["Anket katılımcılarının e-posta adreslerini açıklamak",1,"Gizlilik ve etik ihlali (KVKK)."],["TÜİK verisini kaynak göstererek kullanmak",0,"Referans etik bir kuraldır."],["Sonuç istediğin gibi çıksın diye eski veri seçmek",1,"Güncellik ve etik sorunu."],["Sosyal medya verisini doğrulamadan kullanmak",1,"Farklı kaynakla karşılaştır."]];
function tag(a,o){return a.map(function(i){return{q:i[0],o:o,a:i[1],w:i[2]}})}
var POOL=[].concat(tag(KAT,K),tag(BAG,U),tag(OLC,O8),tag(VER,B),tag(DIJ,D));
function pq(q,o,a,w){return{q:q,o:o,a:a,w:w+" (PDF çalışma kâğıdı)"}}
function pqb(q,o,a,w){return{q:q,o:o,a:a,w:w+" (Ders kitabı, 2. Tema)"}}
var PQ=[
pq("Aşağıdakilerden hangisi kategorik değişkene örnek olamaz?",["Dinlenen müzik türü (pop, rock, rap)","Okulda seçilen yabancı dil","Sınavdan alınan puan","Katıldığı öğrenci kulübü","Yaşadığı şehir"],2,"Puan sayısaldır, diğerleri gruplara ayrılır."),
pq("Hangisi kategorik değişken olarak sınıflandırılamaz?",["Grip aşısı yaptırma durumu","Bir musluktan bir gün boyunca akan su miktarı (litre)","Sosyo-ekonomik durum (alt, orta, üst)","Okula ulaşım için kullanılan araç türü","Doğum ayı (Ocak, Şubat…)"],1,"Litre cinsinden miktar ölçülebilir, sayısaldır."),
pq("Hangisi kategorik değişkenin temel özelliğini en doğru ifade eder?",["Verileri sayısal bir değer yerine, ait oldukları gruplara göre ayırır","Verileri yalnızca tam sayılarla ifade edilen sayılabilir birimler olarak ele alır","Verilerin zaman içindeki değişimini gösterir","Verileri sonsuz değer alabilen bir aralıkta ölçer","Verileri küçükten büyüğe dizmeyi gerektirir"],0,"Kategorik değişken gruplara ayırır."),
pq("Telefon markası, günlük uyku süresi (saat), okul türü, spor dalı, günlük çalışma süresi (dakika). Kaç tanesi kategorik değişkendir?",["2","3","4","5","1"],1,"Telefon markası, okul türü ve spor dalı kategoriktir."),
pq("Hangi araştırma konusu yalnızca iki kategorik değişken arasındaki ilişkiyi incelemektedir?",["Cinsiyet ile matematik puanı","Günlük ders çalışma süresi ile genel not ortalaması","En sevilen ders ile mezuniyet sonrası kariyer hedefi","Coğrafi bölge ile kütüphanede geçirilen aylık saat","Lise türü ile yıl sonu not ortalaması"],2,"Ders ve kariyer hedefi ikisi de kategoriktir; diğerlerinde bir değişken sayısaldır."),

function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function pop(){for(var k=0;k<3;k++){var e=document.createElement("div");e.className="pp";e.textContent=["🎉","⭐","🔥","💯","🚀","🏆","🥳","🎈","💥","🌟"][Math.random()*10|0];e.style.left=(8+Math.random()*84)+"%";e.style.top=(35+Math.random()*35)+"%";e.style.animationDelay=(k*.12)+"s";document.body.appendChild(e);setTimeout(function(x){return function(){x.remove()}}(e),1200)}}
function tbl(g,hid){var T=g.D.map(sum),C=g.c.map(function(_,j){return sum(g.D.map(function(r){return r[j]}))});
 var h='<table><tr><th></th>'+g.c.map(function(x){return'<th>'+x+'</th>'}).join("")+'<th>Toplam</th></tr>';
 g.D.forEach(function(r,i){h+='<tr><th>'+g.r[i]+'</th>'+r.map(function(v,j){return hid&&hid[i]===j?'<td><input class="in" type="number" id="c'+i+'_'+j+'"></td>':'<td>'+v+'</td>'}).join("")+'<td><b>'+T[i]+'</b></td></tr>'});
 return h+'<tr><th>Toplam</th>'+C.map(function(x){return'<td><b>'+x+'</b></td>'}).join("")+'<td><b>'+sum(T)+'</b></td></tr></table>'}
function legend(c){return'<div class="row">'+c.map(function(x,j){return'<span class="pill"><span style="color:'+COLS[j]+'">■</span> '+x+'</span>'}).join("")+'</div>'}
function mini(rl,P){return'<div class="mc">'+P.map(function(r,i){return'<div class="mg"><div class="mb">'+r.map(function(v,j){return'<i style="height:'+Math.round(v*.9)+'px;background:'+COLS[j]+'"><b>'+Math.round(v)+'</b></i>'}).join("")+'</div><span>'+rl[i]+'</span></div>'}).join("")+'</div>'}
var RB=[{r:["Kız","Erkek"],c:["Aksiyon","Romantik","Komedi"]},{r:["Anadolu Lisesi","Fen Lisesi"],c:["Evde","Kütüphanede","Kafede"]},{r:["9. sınıf","10. sınıf"],c:["Spor","Sanat","Dil"]},{r:["Genç","Yaşlı"],c:["Deniz","Kültür","Doğa"]},{r:["Kadın sürücü","Erkek sürücü"],c:["Manuel","Otomatik","Yarı otomatik"]},{r:["Fen Lisesi","Meslek Lisesi"],c:["Futbol","Basketbol","Voleybol"]}];
var STEP={20:5,25:4,40:5,50:2,100:5},TT=[20,25,40,50,100];
function gT(){var P=RB[ri(0,RB.length-1)],Ts=[],pc=[],D=[];
 for(var i=0;i<2;i++){var T=TT[ri(0,4)];if(i&&T===Ts[0])T=TT[(TT.indexOf(T)+1)%5];Ts.push(T);var st=STEP[T],u=100/st,a=ri(1,u-2),b=ri(1,u-a-1),pr=[a,b,u-a-b];pc.push(pr.map(function(x){return x*st}));D.push(pr.map(function(x){return x*st*T/100}))}
 return{r:P.r,c:P.c,D:D,T:Ts,pc:pc}}
function gR(){var P=RB[ri(0,RB.length-1)];return{r:P.r,c:P.c,D:P.r.map(function(){return P.c.map(function(){return ri(5,30)})})}}

function genYA(n){var it=[];for(var k=0;k<n;k++){var g=gT(),C=g.c.map(function(_,j){return sum(g.D.map(function(r){return r[j]}))}),G=sum(g.T);

 cand.forEach(function(x){if(vals.indexOf(x[0])<0&&x[0]>0&&x[0]<=100){vals.push(x[0]);why.push("%"+x[0]+": "+x[1])}});

 return it}

["Kategorik mi, sayısal mı?",`<p>İstatistiksel araştırma süreci gerçek yaşamdan doğar. Araştırdığımız özelliklere <b>değişken</b> denir. Değişkenler ikiye ayrılır:</p><div class="opts"><div class="ex"><b>Kategorik (nitel):</b> değerleri grup/etikettir. Toplama, çıkarma, ortalama anlam ifade etmez. Örnek: kan grubu, cinsiyet, okul türü, telefon markası, doğum ayı.</div><div class="ex x"><b>Sayısal (nicel):</b> ölçülebilir ya da sayılabilir değerlerdir. Örnek: boy (cm), uyku süresi (saat), sınav puanı, aylık maaş.</div></div><table class="learn"><tr><th>Değişken</th><th>Tür</th><th>Neden?</th></tr><tr><td>Kan grubu (A, B, AB, 0)</td><td>Kategorik</td><td>Sınıflandırma; A + B gibi işlem anlamsız.</td></tr><tr><td>Günlük uyku süresi (saat)</td><td>Sayısal</td><td>Ölçülebilir; ortalaması alınır.</td></tr><tr><td>Okul türü (Fen, Anadolu, Meslek)</td><td>Kategorik</td><td>Kategoriler ayrılmış grup.</td></tr><tr><td>Sınav puanı</td><td>Sayısal</td><td>Toplanıp karşılaştırılabilir.</td></tr><tr><td>Doğum ayı (Ocak, Şubat…)</td><td>Kategorik</td><td>Kategorik veriye uygun toplama yapılamaz.</td></tr><tr><td>Musluktan akan su miktarı (litre)</td><td>Sayısal</td><td>Kesikli veya sürekli ölçüm.</td></tr><tr><td>Sosyo-ekonomik durum (alt, orta, üst)</td><td>Kategorik</td><td>Nitel sınıflandırmadır.</td></tr><tr><td>Yılda okunan kitap sayısı</td><td>Sayısal</td><td>Sayılabilir.</td></tr></table><details><summary>🎯 Kendini kontrol: Telefon numarası kategorik mi, sayısal mı?</summary><p>Rakamlardan oluşsa da numara bir <b>etikettir</b>, büyüklük sıralama anlamı yoktur → <b>kategorik</b>. (Forma numarası, şube kodu da öyle.)</p></details>`],

["Kitap bağlamı: Sıfır Atık ve geri dönüşüm",`<p>Kitabın örneği: Sıfır Atık Projesi kapsamında bir öğretmen, etkinlikleri sınıf seviyesine göre farklılaştırmak istiyor. Oluşturduğu bağlam:</p><div class="ex">“A Lisesi’ndeki öğrencilerin <b>sınıf seviyeleri</b> ile <b>geri dönüşüm konusunda bilgi sahibi olma durumları</b> arasında bir ilişki var mıdır?”</div><p>Şemayle inceleyelim:</p><table class="learn"><tr><th>Bağlam şeması</th><th>Bu araştırmada</th></tr><tr><td>Gerçek yaşam durumu (bağlam)</td><td>Sıfır Atık Projesi, geri dönüşüm</td></tr><tr><td>Evren</td><td>A Lisesi’ndeki tüm öğrenciler</td></tr><tr><td>Kategorik değişken 1</td><td>Sınıf seviyesi (9, 10, 11, 12)</td></tr><tr><td>Kategorik değişken 2</td><td>Bilgi sahibi olma durumu (var / yok)</td></tr><tr><td>Kullanılacak araç</td><td>Kâğıt anket ya da çevrim içi form</td></tr></table><details><summary>🎯 Sıra sende: coğrafi işaret örneği</summary><p>Kitapta 30 ürün için “Festivali var mı? (Evet/Hayır)” ve “Coğrafi işaret tescili var mı? (Evet/Hayır)” incelenmiş. Bağlamı sen yaz: “Türkiye’de festivali yapılan ürünlerin festival durumu ile coğrafi işaret tescil durumu arasında ilişki var mıdır?”</p></details>`]

["Çözümlü örnek: Turgutlu Lisesi veri planı",`<p>Soru: “Öğrencilerin sınıf seviyeleri ile su tasarrufu bilgi düzeyleri arasında ilişki var mıdır?” 1250 öğrenci, her kademeden 100 öğrenci.</p><ol><li><b>Araç:</b> Anket (sınıf seviyesi: 9-12; “su tasarrufu önlemi alıyor musunuz? Evet/Hayır”).</li><li><b>Evren/örneklem:</b> Evren 1250 öğrenci, örneklem her kademeden 100 öğrenci.</li><li><b>Rastgelelik:</b> Sınıf listesinden rastgele seçim; herkesin seçilme şansı eşit.</li><li><b>Değişkenler:</b> Bağımsız: sınıf seviyesi, bağımlı: su tasarrufu bilgisi.</li><li><b>Nasıl toplanacak:</b> Anketler öğrencilere dağıtılıp doldurulacak.</li><li><b>Depolama:</b> Formlar okul arşivinde saklanır, veriler istatistik programına aktarılır.</li><li><b>Etik:</b> Gönüllülük ve gizlilik.</li></ol>`],
["Kitap örneği: Barış’ın ikincil veri çelişkisi",`<p>Kitabın 2. Tema girişi: Barış, alışveriş öncesi kullanıcılara yorumlarını inceleyip bilinçli karar vermek istiyor. Sosyal medyada <b>A marka</b> olumlu yorumlar öne çıkarken, e-ticaret sitelerinde <b>B marka</b> daha çok tercih ediliyor. İkisi de <b>ikincil</b> veri! Çelişkiyi neden oluşuyor?</p><div class="opts"><div class="ex">🗣 Sosyal medyada <b>yorum eğilimleri</b>: genel memnuniyet yerine önemli noktalar paylaşılır.</div><div class="ex">🛒 E-ticaret: olumlu/olumsuz yıldız yorumları büyük genişleme örneklemde daha dengeli olabilir.</div><div class="ex">🤖 Ödeme yapan sahte profiller, algoritmanın kullanıcıya gösterdikleri</div></div><p><b>Eleştirel 3 soru (kitabın önerisi):</b></p><ol><li>Sosyal medya ve e-ticaretteki fark üzerinde <b>etkili faktörler</b> neler? (örneklemin sınıflara dağılımı, yorumların doğrulanması, sahte profiller…)</li><li>Kullanıcıların yorum yaparken <b>eğilimleri</b> içerikleri nasıl bozar? (aşırı övgü, aşırı şikâyet)</li><li>Memnuniyet ifadeleri kaynaklar arasında <b>nasıl farklılaşıyor</b>? Sonucu tek kaynağa dayanmak doğru mu?</li></ol><div class="why">Sonuç: başkaları tarafından oluşturulan verilerde, tek kaynağa dayanmadan <b>farklı kaynakları karşılaştır</b> ve her kaynağın örneklemi, kayıt yöntemi, güncelliği ve etik durumu sorgula.</div>`],
["İkincil veri kontrol formu (kendi araştırman için)",`<table class="learn"><tr><th>Sorgu</th><th>Örnek sorum</th></tr><tr><td>Güvenilirlik</td><td>Kaynak resmî ya da uzman mı?</td></tr><tr><td>Güncellik</td><td>Verinin yılı araştırmamı uygun mu?</td></tr><tr><td>Uygunluk</td><td>Kategorileşmek mümkün mi? Değişkenlerim tam mı?</td></tr><tr><td>Yasal haklar</td><td>Telif/izin durumu var mı?</td></tr><tr><td>Etik kullanım</td><td>Kaynak gösterecek miyim? Kişisel veri açık mı? En az bir başka kaynakla karşılaştırdım mı?</td></tr></table><details><summary>🎯 Uygulama: kitaptan PISA örneği</summary><p>PISA tablosu bir <b>başkaları tarafından oluşturulan</b> veridir: resmî programın (güvenilirlik) sonuçları, güncel yıl, uygun kategoriler (Başarılı/Başarısız), anonim veri. Yine de dikkat: “nedensellik” kurulamaz — sadece ilişki görülebilir.</p></details>`]
];
L.cap=[
["İki yönlü tablo (çapraz tablo) nedir?",`<p>İki kategorik değişkeni <b>aynı anda</b> gösteren tablodur. Bir değişkenin kategorileri <b>satırlara</b>, diğerininki <b>sütunlara</b> yazılır. Her <b>hücre</b>, iki kategorinin kesiştiği yerdeki kişi sayısını (frekans) verir.</p>`+tbl({r:["Kız","Erkek"],c:["Matematik","Fen","Tarih"],D:[[25,15,10],[20,25,5]]})+`<div class="opts"><div class="ex">🟨 <b>Satır:</b> Cinsiyet</div><div class="ex">🟦 <b>Sütun:</b> Favori ders</div><div class="ex">🔢 <b>Hücre:</b> Kız ∩ Fen = 15 kişi</div><div class="ex">➕ <b>Sağ alt köşe:</b> genel toplam = 100</div></div><details><summary>🎯 Mini kontrol: Erkeklerin toplamı? Matematik’i seçenler?</summary><p>Erkek: 20+25+5 = <b>50</b>. Matematik: 25+20 = <b>45</b>.</p></details><div class="why"><b>Altın kural:</b> satır toplamlarının toplamı = sütun toplamlarının toplamı = genel toplam. Tutmuyorsa bir yerde hata var!</div>`],
["Ham veriden çapraz tabloya: çentik yöntemi",`<p>Elinde şöyle bir liste olsun (yaş grubu – tatil türü): Genç-Deniz, Genç-Doğa, Yaşlı-Doğa, Genç-Deniz, Orta Yaş-Kültür, Yaşlı-Doğa.</p><ol><li>Hangi değişken <b>satırda</b>, hangisi <b>sütunda</b> olacak karar ver (burada yaş grubu satırda).</li><li>Satır ve sütun başlıklarını yaz.</li><li>Listedeki her gözlem için kesiştiği hücreye <b>bir çentik</b> at: Genç-Deniz → ||.</li><li>Çentikleri say, sayıları yaz.</li><li>Satır ve sütun toplamlarını yaz; genel toplam gözlem sayısına (6) eşit mi kontrol et.</li></ol>`+tbl({r:["Genç","Orta Yaş","Yaşlı"],c:["Deniz","Kültür","Doğa"],D:[[2,0,1],[0,1,0],[0,0,2]]})+`<div class="why">İpucu: Bir gözlemi iki kez saymamak için listeden çentik attıkça üstünü çiz.</div>`],
["Eksik hücreyi bulma: çözümlü örnekler",`<b>Örnek 1 – Cinsiyet × Spor.</b> Kız toplam 50, Kız–Voleybol 40, Basketbol sütun toplamı 50, genel toplam 150.<ol><li>Kız–Basketbol = 50 − 40 = <b>10</b></li><li>Erkek–Basketbol = 50 − 10 = <b>40</b></li><li>Erkek toplamı = 150 − 50 = <b>100</b></li><li>Erkek–Voleybol = 100 − 40 = <b>60</b></li></ol>`+tbl({r:["Kız","Erkek"],c:["Basketbol","Voleybol"],D:[[10,40],[40,60]]})+`<details><summary>🧮 Örnek 2 – x ve y’li tablo</summary><p>Kahverengi gözlü: Kız 2x−y, Erkek x+y (toplam 45). Mavi gözlü: Kız 2y, Erkek 3y (toplam 90).</p><ol><li>Sütun toplamı: (2x−y)+(x+y) = 3x = 45 → <b>x = 15</b></li><li>Mavi: 2y+3y = 5y = 90 → <b>y = 18</b></li><li>Kız-kahverengi = 30 − 18 = 12; Kız toplamı = 12 + 36 = 48</li><li>Kahverengi gözlü kızların koşullu göreli sıklığı = 12/48 = <b>%25</b></li></ol></details><div class="why">Strateji: önce toplamı bilinen satır/sütunlardan başla; her adımda yalnızca <b>bir bilinmeyen</b> kalsın.</div>`],
["Kitap örneği: sınıf seviyesi × kurs tercihi",`<p>Kitabın çalışması: 100 öğrencilik okulda “sınıf seviyesi ile kurs tercihi” incelenmiş.</p>`+tbl({r:["9. sınıf","12. sınıf"],c:["Spor","Sanat"],D:[[32,18],[48,2]]})+`<p><b>Adım adım okuma:</b></p><ol><li>Satır toplamları: 9. sınıf 32+18 = <b>50</b>; 12. sınıf 48+2 = <b>50</b>. Genel toplam 100 her iki değişken için tutarlı (32+48=80 spor, 18+2=20 sanat ✓).</li><li>Ham sayıdan “12. sınıf spor” sonuca varmak yanıltıcıdır: 48 &gt; 32 diye 12. sınıf “sporu daha çok sevmez”; iki gruptan her biri 50 kişidir ve oran kıyaslaması gerek.</li><li>Yüzde dönüşüm (satıra göre): 32/50 = <b>%64</b>, 18/50 = %36; 48/50 = <b>%96</b>, 2/50 = %4.</li></ol><div class="why">Kitabın yorumu: 9. sınıfın %64’ü, 12. sınıfın %96’sı sporu seçiyor — sınıf seviyesi arttıkça sanattan sporu yönelme eğilimi görülüyor. Ama bu yalnızca <b>ilişki</b>dir.</div>`],
["Ham veriden tabloya: film ve müzik tercihleri (30 kişi)",`<p>Kitabın çalışması: 30 öğrenciden film türü ve müzik türü bilgileri toplanmış. Öncelikle listeden çentik yöntemiyle <b>Tablo 6</b> oluşturulmuş:</p>`+tbl({r:["Türk Halk Müziği","Türk Sanat Müziği","Klasik Türk Müziği"],c:["Bilim Kurgu","Macera","Komedi"],D:[[1,3,5],[3,5,2],[8,2,1]]})+`<p><b>Satır/sütun okuma (adım adım):</b></p><ol><li>Satır toplamları: THM 9, TSM 10, KTM 11 → toplam 30.</li><li>Sütun toplamları: Bilim Kurgu 12, Macera 10, Komedi 8 → toplam 30 ✓ (çapraz kontrol: iki yönde de 30).</li><li>Tek hücreden koşullu oran örneğinden: Bilim Kurgu tercih edenler arasında KTM = 8/12 ≈ <b>%67</b>; Tüm sınıfta KTM görülen göreli sıklık = 11/30 ≈ <b>%37</b> — hangi paydadan gelir bakmadan oran boş bir sayıdır!</li></ol><details><summary>🎯 Kontrol: “Listenin 16. öğrencisi Komedi–Türk Halk Müziği” listede hücresi?</summary><p>Komedi sütunu ∩ THM satırı: bu hücredeki frekans 5’tir; yeni bir gözlem olsaydı 6 olurdu.</p></details>`],
["Kitap örneği: Geleceğe Nefes (200 öğrenci)",`<p>Okul rehber öğretmeni “projeye katılma durumu ile çevre farkındalığı arasında ilişki var mı?” araştırıyor. <b>Tablo 5:</b></p>`+tbl({r:["Düşük","Orta","Yüksek"],c:["Katıldı","Katılmadı"],D:[[20,50],[50,30],[30,20]]})+`<p><b>Çözümlü analiz:</b></p><ol><li>Satır toplamları: 70, 80, 50 → genel 200. Sütun toplamları: katılan 100, katılmayan 100 ✓.</li><li><b>Göreli sıklık (genel toplama göre):</b> Düşük–Katıldı 20/200 = <b>%10</b>; Orta–Katıldı = <b>%25</b>; Yüksek–Katıldı = <b>%15</b>. Toplamda katılanlar = %50.</li><li><b>Sütuna göre koşullu (katılımda farkındalık dağılımı):</b> Katılanlar: %20 düşük, %50 orta, %30 yüksek; Katılmayanlar: %50 düşük, %30 orta, %20 yüksek.</li><li><b>Satıra göre koşullu (farkındalıkta katılım oranı):</b> Düşük: 20/70 ≈ %29; Orta: 50/80 ≈ %63; Yüksek: 30/50 = %60.</li></ol><div class="why">İki yönlü de fark görünüyor: katılanlarda yüksek farkındalık %30 iken katılmayanlarda %20. Ama “farkındalık projeye katılımı sağlar” demek nedensellik yanılgısıdır — mesela gönüllülük, aile ilginisi gibi faktörler de etkilidir.</div>`]
];
L.kgs=[
["Koşullu göreli sıklık nedir?",`<p>Bir kategorik değişkenin, diğer değişkenin <b>bir kategorisine bağlı</b> yüzdelik dağılımıdır. İki kategorik değişken arasındaki ilişkiyi görmenin en güçlü aracıdır.</p><div class="why"><b>Koşullu göreli sıklık = (bir koşulun tekrar sayısı ÷ o koşulun toplam tekrar sayısı) × 100</b></div>`+tbl({r:["Erkek","Kadın"],c:["Aksiyon","Romantik"],D:[[20,5],[10,15]]})+`<p>Soru: “Erkekler arasında aksiyon tercih edenlerin oranı?” Koşul: <b>erkek olmak</b>. Payda = erkeklerin toplamı = 25 (genel toplam olan 50 değil!).</p><details><summary>⚠️ En sık yapılan hata</summary><p>20/50 = 0,4 yazmak. Bu, genel toplama oran. Koşullu göreli sıklıkta payda <b>kendi satırının (ya da sütununun) toplamıdır</b>: 20/25 = %80.</p></details>`],
["Adım adım hesaplama + kısa yol",`<ol><li>Hangi gruba “göre” oran isteniyor? O grup = <b>koşul</b> (satır mı sütun mu).</li><li>O satırın toplamını payda yap.</li><li>Her hücreyi o toplama böl.</li><li>Kesri <b>%</b> yaz. Satırın toplamı %100 çıkmalı.</li></ol><table><tr><th></th><th>Aksiyon</th><th>Romantik</th><th>Toplam</th></tr><tr><th>Erkek</th><td>20/25 = %80</td><td>5/25 = %20</td><td>%100</td></tr><tr><th>Kadın</th><td>10/25 = %40</td><td>15/25 = %60</td><td>%100</td></tr></table><div class="why"><b>Kısa yol:</b> Paydayı 100 yapabiliyorsan bölme yapma! 20/25: pay ve paydayı 4 ile çarp → 80/100 = %80. Benzer: /20 → ×5, /50 → ×2, /40 → ×2,5.</div><details><summary>🎯 Dene: 18/40 kaç %?</summary><p>18/40 = 45/100 = <b>%45</b> (×2,5).</p></details>`],
["Satıra mı, sütuna mı göre?",`<p>Aynı tablodan iki farklı koşullu tablo çıkar. Cümledeki “…<b>göre</b>” kelimesine bak: “göre”den önceki değişken <b>koşuldur</b>.</p>`+tbl({r:["Kadın","Erkek"],c:["Kısa","Ortalama","Uzun"],D:[[40,30,30],[30,50,20]]})+`<div class="opts"><div class="ex"><b>Cinsiyete göre boy:</b> satır toplamına böl. Erkek: 30/100 = %30, 50/100 = %50, 20/100 = %20.</div><div class="ex x"><b>Boya göre cinsiyet:</b> sütun toplamına böl. Kısa: Erkek 30/70 ≈ %43, Kadın 40/70 ≈ %57.</div></div><div class="why">Hangi yönde olduğunu yanlış seçersen yüzdeler tamamen farklı çıkar. Her seferinde sor: <b>“Kimlerin arasında?”</b> Cevap paydayı belirler.</div>`],
["Sonuçları yorumlama kalıbı",`<ol><li>Gruplar <b>kendi içinde</b> kıyaslanır: “Erkeklerin %80’i aksiyon seçerken kadınların %40’ı seçmiştir.”</li><li>Yüzdeler gruplar arasında <b>belirgin farklıysa</b> değişkenler arasında bir ilişki olabilir.</li><li>Yüzdeler hemen hemen aynıysa ilişki zayıftır (tercih cinsiyete bağlı görünmüyor).</li><li>Daima ekle: “bu bir ilişkidir, neden-sonuç değildir; örneklem büyüklüğü de önemli.”</li></ol><div class="ex">Örnek (spor × egzersiz): Dans seçenlerin %80’i düzenli egzersiz yaparken masa tenisi seçenlerin %60’ı hiç yapmıyor → spor türü ile egzersiz sıklığı arasında ilişki var gibi görünür.</div><details><summary>🏅 Dene: Satır oranlarını kıyaslarken ham sayıya bakmak neden yanıltır?</summary><p>Gruplar farklı büyüklükte olabilir. 40 kişilik bir grupta 30 kişi, 100 kişilik grupta 50 kişiden daha yüksek oran (%75 &gt; %50) demektir, ama ham sayı daha küçüktür.</p></details>`],
["Göreli sıklık mı, koşullu göreli sıklık mı?",`<p>Kitabın özenli ayrımı:</p><div class="opts"><div class="ex"><b>Göreli sıklık:</b> her hücredeki frekans ÷ <b>genel toplam</b>. Verilerin <b>genel dağılımını</b> yüzde olarak gösterir.</div><div class="ex x"><b>Koşullu göreli sıklık:</b> frekans ÷ <b>seçili alt grubun (koşulun) toplamı</b>. Belirli bir kategoriye bağlı (koşullu) dağılımı gösterir; ilişkililiği daha net ortaya koyar.</div></div><p>Aynı kurs tablosunda iki okuma:</p><table><tr><th>Hangisi</th><th>Hesap</th><th>Sonuç</th></tr><tr><td>Göreli: 9. sınıf–Spor</td><td>32 ÷ 100</td><td>%32 (tüm okul içinde)</td></tr><tr><td>Koşullu: 9. sınıflar arasında Spor</td><td>32 ÷ 50</td><td>%64 (9. sınıfların içinde)</td></tr><tr><td>Koşullu: Spor tercih edenler içinde 9. sınıf</td><td>32 ÷ 80</td><td>%40</td></tr></table><div class="why">Karar kuralı: Paydanın “tüm sınıf mı, seçilmiş bir grup mu” olduğunu belirle. Cümlede <b>“…-ler arasında, …-lerine göre”</b> ifadesi varsa koşullu, <b>“tümü içinde”</b> varsa göreli sıklıktır.</div>`],
["Kitap örneği: film–müzik koşullu tabloları (çözümlü)",`<p>Kitap aynı 30 kişilik tablodan <b>iki yönde</b> koşullu tablo çıkarmış:</p><p><b>Tercih edilen film türlerine göre müzik (%):</b> (payda = film sütun toplamları)</p>`+tbl({r:["Bilim Kurgu","Macera","Komedi"],c:["THM","TSM","KTM"],D:[[1,3,8],[3,5,2],[5,2,1]]})+`<div class="why"><b>Dikkat:</b> Bu tablo Tablo 6’nın transpozudur; her satırın toplamı, film sütununun toplamıdır (12, 10, 8). Kitabın gerçek yüzdeleri şöyle: Bilim Kurgu (payda 12): THM 1/12 ≈ %8, TSM 3/12 ≈ %25, KTM 8/12 ≈ <b>%67</b>. Macera (payda 10): THM %30, TSM <b>%50</b>, KTM %20. Komedi (payda 8): THM 5/8 ≈ <b>%62,5</b>, TSM %25, KTM %12,5.</div><p><b>Tercih edilen müzik türlerine göre film (%):</b> (payda = müzik satır toplamları) THM (payda 9): BK %11, Macera %33, Komedi ≈ <b>%56</b>; TSM (payda 10): BK 3/10 = %30, Macera <b>%50</b>, Komedi %20; KTM (payda 11): BK 8/11 ≈ <b>%73</b>, Macera %18, Komedi %9.</p><details><summary>🎯 Kontrol: “TSM dinleyenler arasında macera sevenlerin oranı”: hangi payda?</summary><p>TSM satır toplamı 10: 5/10 = <b>%50</b>.</p></details><div class="why">Kitabın yorumu: belirli film türü tercihleri ile müzik türü tercihleri arasında bir eğilim var (“bilim kurgu sevenler klasik müziğe yüz tutuyor”), ama bu <b>nedensellik</b> değildir; film izlemek müzik zevkini belirlemez, tersi de.</div>`]
];
L.kum=[
["Kümeli sütun grafiği nasıl çizilir?",`<ol><li>Önce <b>koşullu göreli sıklık tablosunu</b> yüzde olarak hazırla.</li><li>Yatay eksene koşul değişkeninin kategorilerini yaz (örn. Erkek, Kadın).</li><li>Her kategori için, diğer değişkenin her kategorisine bir <b>sütun</b> çiz, sütunlar yan yana dursun.</li><li>Dikey eksen %0–%100 olsun; eksen kesilmesin.</li><li>Renkleri bir <b>lejantla</b> açıkla, eksenlere ve grafiğe isim ver.</li></ol><b>Film tercihi (%100)</b>`+mini(["Erkek","Kadın"],[[80,20],[40,60]])+legend(["Aksiyon","Romantik"])+`<div class="why">Tablodaki her satır = grafikte bir sütun grubu. Her grubun sütunları toplam %100 yapar.</div>`],
["Grafiği okuma ve yorumlama",`<ul><li>Her sütun grubu <b>kendi içinde %100</b>’dür; gruplar arası ham sayı kıyaslanmaz.</li><li>Aynı renkli sütunları gruplar arasında kıyasla: Erkeklerde aksiyon %80, kadınlarda %40 → erkeklerde daha yüksek.</li><li>Sütun yükseklikleri iki grupta <b>benzerse</b> ilişki zayıf, <b>çok farklıysa</b> ilişki güçlü olabilir.</li></ul>`+mini(["Kısa","Ortalama","Uzun"],[[43,57],[62,38],[40,60]])+legend(["Erkek","Kadın"])+`<div class="ex">Boy düzeyine göre cinsiyet: Ortalama boyda erkek oranı (%62) kadından yüksek, kısa ve uzun boyda kadın oranı daha yüksektir.</div><details><summary>🔍 Dikkat edilecekler</summary><p>Grafikte neyin neye göre %100 olduğuna (satır mı, sütun mu) mutlaka bak. Eksenin %0’dan başlamasına da dikkat et!</p></details>`],
["Kitap örneği: kurs tercihi grafiği (%64/%36 → %96/%4)",`<p>Kurs tablosunun <b>satıra göre</b> koşullu yüzdeleri ve grafik hâli:</p>`+mini(["9. sınıf","12. sınıf"],[[64,36],[96,4]])+legend(["Spor","Sanat"])+`<p><b>Sütuna göre grafiği:</b></p>`+mini(["Spor","Sanat"],[[40,60],[90,10]])+legend(["9. sınıf","12. sınıf"])+`<p><b>Yorum (kitap düşünülemi):</b> 12. sınıfta spor oranı (%96) önemli ölçüde artmış, sanat oranı (%4) azalmış. Spor tercih edenler içinde 12. sınıf (%60) öne çıkar; sanatla ilgilenenlerin çoğu 9. sınıflardandır (%90).</p><div class="why">İlişki görülmesine rağmen kitap bunu nedensel yorumlamamaya uyarıyor: sınıf seviyesi spor ilgisini artırmak zorunda değildir — bağlam (çevre, okul imkânları, yaş değişimi) ayrıca incelenmeli.</div>`],
["PISA örneği: okuma–matematik grafiği (çözümlü)",`<p>Matematik başarısına göre okuma başarısı koşullu yüzdeleri ve grafik:</p>`+mini(["Mat. Başarılı","Mat. Başarısız"],[[75,25],[40,60]])+legend(["Okuma Başarılı","Okuma Başarısız"])+`<p><b>Sütuna göre:</b> Okuma başarılılar (65 kişi): matematik başarılı 45/65 ≈ %69; okuma başarısızlar: 20/45 ≈ %44.</p><div class="why">İki yönde de farklılaşma var → iki kategorik değişken (okuma başarısı × matematik başarısı) arasında ilişki görünüyor. Ama kitabın uyarısı geçeri: <b>ilişki ≠ nedensellik</b>; gerekli ek analizler yapılmadan “okumak matematiği oğlu artırır” gibi bir neden-sonuç kurulamaz.</div>`]
];
L.hata=[
["Neden eleştirel bakmalıyız?",`<p>Başkalarının hazırladığı tablo ve grafiklerden çıkan yorumlar <b>yanlış yönlendirebilir</b>. Her yorum karşısında üç soru sor:</p><div class="opts"><div class="ex">🔎 Örneklem evreni temsil ediyor mu?</div><div class="ex">📏 Ölçüm araçları doğru seçilmiş mi?</div><div class="ex">⚠️ Yorumda bir hata veya yanlılık var mı?</div></div><b>1. Nedensellik yanılgısı</b><div class="ex">Gelir yüksek, kurallara uyum yüksek diye “gelir kurallara uydurur” demek. İki değişken birlikte hareket eder ama biri diğerinin nedeni olmak zorunda değil.</div><b>2. Eksik değişken yanlılığı</b><div class="ex">Mağaza geliri yüksek, fiyat düşük diye “fiyat geliri belirler” demek; müşteri yoğunluğu ve hizmet kalitesi unutuldu.</div><b>3. Ön yargılı yorumlama</b><div class="ex">Matematik başarısı ile diğer derslerin aynı olacağını önceden varsayıp yorumu buna uydurmak.</div>`],
["Örneklemle ilgili yanlılıklar",`<b>4. Seçim yanlılığı</b><div class="ex">Verinin/örneklemin analize uygun olmayan şekilde seçilmesi: her sınıfta sadece derece yapan öğrencilere anket yapmak.</div><b>5. Örneklem yanlılığı</b><div class="ex">Örneklem evreni yeterince yansıtmıyor: sadece özel okullar ya da 15 öğrenci.</div><b>6. Kapsam yanlılığı</b><div class="ex">Belirli bir grubun araştırmaya hiç dahil edilmemesi: anketi sadece kız öğrencilere uygulamak.</div><b>7. Aşırı genelleme</b><div class="ex">Bir şehirdeki hobi sonuçlarını tüm Türkiye için yorumlamak.</div><div class="why">Ayırt etme: Kim <b>dışarıda kaldı</b>? → kapsam. Örnek <b>yanlış/yetersiz mi seçildi</b>? → seçim/örneklem. Sonuç <b>fazla geniş yorumlandı</b>? → aşırı genelleme.</div>`],
["Veri ve grafikle ilgili hatalar",`<b>8. Yanlış sınıflandırma</b><div class="ex">Kategorik verinin yanlış gruba yazılması: lise mezununu üniversite mezunu kaydetmek.</div><b>9. Yanlış ölçüm hatası</b><div class="ex">Değişkenin gerçek değerine uygun ölçülememesi veya yanlış kaydedilmesi.</div><b>10. Görselleştirmeyi hatalı çizme</b><div class="ex">Eksenin %0’dan başlamaması, farkı olduğundan büyük göstermek ya da oranı çok küçük diye sütunu hiç çizmemek.</div><div class="why">Grafiği görünce ilk bak: eksen %0’dan mı başlıyor? Tüm kategoriler çizilmiş mi?</div>`],
["Çözümlü örnek: yeşil çay",`<p>Araştırmacı: “Yeşil çay içenler zayıflamaya daha yatkın.”</p>`+tbl({r:["Yeşil çay içen","Yeşil çay içmeyen"],c:["Zayıflayan","Zayıflamayan"],D:[[80,24],[36,60]]})+`<p><b>a) Dayanak (koşullu göreli sıklık):</b> İçenler: 80/104 ≈ <b>%77</b> zayıflamış; içmeyenler: 36/96 ≈ <b>%38</b>.</p><p><b>b) Hatalar:</b></p><ul><li><b>Nedensellik yanılgısı:</b> çay içmek zayıflamanın nedeni diye sunulamaz.</li><li><b>Eksik değişken:</b> beslenme, stres, uyku, genetik hesaba katılmadı.</li><li><b>Seçim yanlılığı:</b> çay içenlerin diyet yapıp yapmadığı, kan değerleri, sosyo-ekonomik durumu bilinmiyor.</li></ul><p><b>c) Doğru yorum:</b> “Yeşil çay içenlerin zayıflama oranı daha yüksek, bir ilişki var görünüyor; ama diğer etkenler kontrol edilmeden çayın nedeni olduğu söylenemez.”</p><details><summary>🏃 Şimdi sen: spor yapan 70 sağlıklı + 30 rahatsızlık; yapmayan 10 sağlıklı + 50 rahatsızlık</summary><p>Spor yapanlarda rahatsızlık 30/100 = %30; yapmayanlarda 50/60 ≈ %83. İlişki güçlü ama “spor önler” demek nedensellik yanılgısıdır; yaş, beslenme, genetik gibi değişkenler de etkili olabilir.</p></details>`],
["Kitap örneği: Barış’ın çelişkisi (uygulamalı)",`<p>Aynı konuda <b>iki farklı kaynak</b>, iki farklı sonuç üretirse araştırmacı ne yapmalı? Kitap, A ve B marka örneğinde şunların sorgulanmasını önerir:</p><ol><li><b>Örneklem sorusu:</b> Sosyal medya yorumcuları genel kullanıcıyı temsil ediyor mu? E-ticaret yorumcuları?</li><li><b>Eğilim sorusu:</b> Yorum yapanlar genellikle çok memnun ya da çok rahatsız olanlardır; sessiz çoğunluk görünmeyebilir (sessizlik yanlığı).</li><li><b>Bağlam sorusu:</b> Platformların kullanıcı kitlesi ve yorum mekanizmaları farklı olabilir; sahte/profilsiz yorumlar olabilir mi?</li></ol><p><b>Çözümlü karar:</b></p><div class="ex">✔ İki kaynağın oranlarını birlikte sun: “Sosyal medyada A (%), e-ticarette B (%) öne çıkıyor…”</div><div class="ex x">✘ Tek kaynağa dayanarak “A kesin daha iyi” diye satın alma önerisi yazmak.</div><div class="why">Altın öğret: Başkaları tarafından oluşturulan veri her zaman <b>kontrol formundan geçmeli</b> (güvenilirlik, güncellik, uygunluk, yasal haklar, etik) ve farklar bir <b>kaynak/örneklem farkı</b> olabilir — gerçek bir fark olduğunu aceleye getirmeden söyle.</div>`],
["Hata avcısı: 8 durumu kendin sınıflandır",`<p>Sahneyi oku, ardından cevabı aç:</p><details><summary>1) “Çay içenler daha zayıf” → “çay kilo verdirir” deniyor.</summary><p><b>Nedensellik yanılgısı.</b> İlişki var ama neden-sonuç kurulamaz; beslenme, egzersiz gibi faktörler hesaba katılmadı.</p></details><details><summary>2) Anket yalnızca derece öğrencilerine uygulandı.</summary><p><b>Seçim yanlılığı.</b> Rastgele ve kapsayıcı örneklem gerekir.</p></details><details><summary>3) Anket yalnızca kız öğrencilere uygulandı.</summary><p><b>Kapsam yanlılığı.</b> Erkek öğrenciler kapsam dışı kalmış.</p></details><details><summary>4) Yalnız özel okullar → “tüm okullar” yorumu.</summary><p><b>Örneklem yanlılığı.</b> Örneklem evrenin alt gruplarını yansıtmıyor.</p></details><details><summary>5) Y eksenine %20’den başlandı.</summary><p><b>Görselleştirmeyi hatalı çizme.</b> Eksen kesilirse fark abartılır; eksen %0’dan başlamalı.</p></details><details><summary>6) Boylar bozuk metreyle ölçüldü.</summary><p><b>Yanlış ölçüm hatası.</b> Değer gerçekten ölçülmüyor; kayıt yanlış.</p></details><details><summary>7) Lise mezunları yanlışlıkla “üniversite mezunu” kodlandı.</summary><p><b>Yanlış sınıflandırma.</b> Kategori sınırı doğru kurulmalı; oranlar bulaşıyor.</p></details><details><summary>8) “Fiyat düştü, gelir arttı → fiyat geliri belirliyor” deniyor.</summary><p><b>Eksik değişken yanlılığı</b> (+ nedensellik riski): müşteri yoğunluğu ve hizmet kalitesi gibi değişkenler hesaba katılmadı.</p></details><div class="why">İpucu: Hataları iki gruba ayır — <b>veri toplama aşamasındaki</b> hatalar (örneklem, kapsam, ölçüm, sınıflandırma) ve <b>yorum aşamasındaki</b> hatalar (nedensellik, eksik değişken, ön yargı, aşırı genelleme). Her durumda gerekçeni yaz: hangi kanıt, hangi hatayı gösteriyor?</div>`]
];
